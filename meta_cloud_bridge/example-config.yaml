# Homeserver details
homeserver:
    # The address that this appservice can use to connect to the homeserver.
    address: http://localhost:8008
    # The address that whatsapp can use to download media from the homeserver.
    public_address: https://matrix.example.com
    # The domain of the homeserver (for MXIDs, etc).
    domain: example.com
    # Whether or not to verify the SSL certificate of the homeserver.
    # Only applies if address starts with https://
    verify_ssl: true
    # What software is the homeserver running?
    # Standard Matrix homeservers like Synapse, Dendrite and Conduit should just use "standard" here.
    software: standard

# Application service host/registration related details
# Changing these values requires regeneration of the registration.
appservice:
    # The address that the homeserver can use to connect to this appservice.
    address: http://localhost:29340

    # The hostname and port where this appservice should listen.
    hostname: 0.0.0.0
    port: 29340
    # The maximum body size of appservice API requests (from the homeserver) in mebibytes
    # Usually 1 is enough, but on high-traffic bridges you might need to increase this to avoid 413s
    max_body_size: 1

    # The full URI to the database. SQLite and Postgres are fully supported.
    # Other DBMSes supported by SQLAlchemy may or may not work.
    # Format examples:
    #   Postgres: postgres://username:password@hostname/dbname
    database: postgres://username:password@hostname/db

    # The unique ID of this appservice.
    id: meta_cloud_bridge
    # Username of the appservice bot.
    bot_username: meta_cloud_bot
    # Display name and avatar for bot. Set to "remove" to remove display name/avatar, leave empty
    # to leave display name/avatar as-is.
    bot_displayname: Meta Cloud Bridge bot
    bot_avatar: mxc://maunium.net/NeXNQarUbrlYBiPCpprYsRqr

    # Whether or not to receive ephemeral events via appservice transactions.
    # Requires MSC2409 support (i.e. Synapse 1.22+).
    # You should disable bridge -> sync_with_custom_puppets when this is enabled.
    ephemeral_events: true

    # Authentication tokens for AS <-> HS communication. Autogenerated; do not modify.
    as_token: "This value is generated when generating the registration"
    hs_token: "This value is generated when generating the registration"

# Bridge config
bridge:
    # The power levels of the user
    default_user_level: 9001
    # default power levels of the room
    default_power_levels:
        events_default: 0
        users_default: 0
        state_default: 0
        redact: 99
        ban: 99
        kick: 99
        invite: 99
    # The power levels of the events
    default_events_levels:
        REACTION: 0
        ROOM_NAME: 0
        ROOM_AVATAR: 0
        ROOM_TOPIC: 0
        ROOM_ENCRYPTION: 99
        ROOM_TOMBSTONE: 99

    # Localpart template of MXIDs for remote users.
    # {userid} is replaced with the Meta remote user identifier (phone, PSID, or IGSID).
    username_template: "meta_{userid}"

    meta_cloud:
        # Legacy key name kept for compatibility. Applies to all Meta remote users.
        # {displayname} is replaced with the displayname of the remote user.
        # {userid} is replaced with the Meta remote user identifier.
        displayname_template: "{displayname} (Meta)"
        # How rooms are named.
        # {displayname} - displayname set by the remote user, when available
        # {userid} - Meta remote user identifier
        room_name_template: "{displayname} ({userid})"
        # Url to open maps
        # Google maps URL.
        # {latitude} and {longitude} is replaced with valid values.
        google_maps_url: https://www.google.com/maps
        openstreetmap_url: https://www.openstreetmap.org/#map=15/

    # The prefix for commands. Only required in non-management rooms.
    command_prefix: "!meta"

    # Whether or not Matrix m.notice-type messages should be bridged.
    bridge_notices: false
    # Whether or not created rooms should have federation enabled.
    # If false, created portal rooms will never be federated.
    federate_rooms: true

    # Whether or not to use /sync to get read receipts and typing notifications
    # when double puppeting is enabled
    sync_with_custom_puppets: false

    # Provisioning API part of the web server for automated portal creation and fetching information.
    # Used by things like mautrix-manager (https://github.com/tulir/mautrix-manager).
    provisioning:
        # Whether or not the provisioning API should be enabled.
        enabled: true
        # The prefix to use in the provisioning API endpoints.
        prefix: /_matrix/provision
        # The shared secret to authorize users of the API.
        # Set to "generate" to generate and save a new token.
        shared_secret: generate

    # Whether to explicitly set the avatar and room name for private chat portal rooms.
    # If set to `default`, this will be enabled in encrypted rooms and disabled in unencrypted rooms.
    # If set to `always`, all DM rooms will have explicit names and avatars set.
    # If set to `never`, DM rooms will never have names and avatars set.
    private_chat_portal_meta: default

    # Permissions for using the bridge.
    # Permitted values:
    #      relay - Allowed to be relayed through the bridge, no access to commands.
    #       user - Use the bridge with puppeting.
    #      admin - Use and administrate the bridge.
    # Permitted keys:
    #        * - All Matrix users
    #   domain - All users on that homeserver
    #     mxid - Specific user
    permissions:
        "*": "relay"
        "example.com": "user"
        "@admin:example.com": "admin"

    relay:
        # Whether relay mode should be allowed. If allowed, `!mt set-relay` can be used to turn any
        # authenticated user into a relaybot for that chat.
        enabled: true
        # The formats to use when sending messages to Signal via a relay user.
        #
        # Available variables:
        #   $sender_displayname - The display name of the sender (e.g. Example User)
        #   $sender_username    - The username (Matrix ID localpart) of the sender (e.g. exampleuser)
        #   $sender_mxid        - The Matrix ID of the sender (e.g. @exampleuser:example.com)
        #   $message            - The message content
        message_formats:
            m.text: "*$sender_displayname*: $message"
            m.notice: "*$sender_displayname*: $message"
            m.file: "*$sender_displayname*: $message"
            m.image: "*$sender_displayname*: $message"
            m.audio: "*$sender_displayname*: $message"
            m.video: "*$sender_displayname*: $message"
            m.location: "*$sender_displayname*: $message"

    interactive_messages:
        # Button message that will be sent to Matrix, you can customize it as you want.
        # This message has variables that containt the data of the button message, you can use it
        # using a {} symbol and the variable name.
        # The variables are:
        #   - title: The button title of the list
        #   - id: The id of the button (string)
        #   - index: The index of the button (int)
        button_message: "{index}. {title}\n"
        # List message that will be sent to Matrix, you can customize it as you want.
        # This message has variables that containt the data of the list message, you can use it
        # using a {} symbol and the variable name.
        # The variables are:
        #   - section_title: The section title of the list
        #   - section_index: The index of the section
        #   - row_title: The title of the row
        #   - row_description: The description of the row
        #   - row_id: The id of the row
        #   - row_index: The index of the rows
        list_message: "{row_index}. {row_title}\n"

# Official Meta Graph API settings.
meta:
    graph_base_url: https://graph.facebook.com
    instagram_base_url: https://graph.instagram.com
    version: v25.0
    app_id: ""
    # Used only for X-Hub-Signature-256 webhook validation. Never log or commit this value.
    app_secret: ""
    # Instagram has a separate app secret (visible in Instagram API Settings > "Instagram app secret").
    # Used for X-Hub-Signature-256 validation of Instagram object webhooks.
    instagram_app_secret: ""
    # Path prefix for webhook endpoints. The webhook receive endpoint is /receive under this prefix.
    # Example callback URL: https://bridge.example.com/cloud/receive
    webhook_path: /cloud
    # Meta webhook verification token. Set to "generate" to generate a random value on first update.
    verify_token: generate
    require_webhook_signature: true
    # Configure production/test Meta assets here. Access tokens must be stored securely.
    accounts:
        # - id: whatsapp-main
        #   channel: whatsapp
        #   owner_mxid: "@admin:example.com"
        #   invite_mxids:
        #     - "@support:example.com"
        #   waba_id: "<WHATSAPP_BUSINESS_ACCOUNT_ID>"
        #   phone_number_id: "<PHONE_NUMBER_ID>"
        #   access_token: "<SYSTEM_USER_OR_TEMPORARY_TOKEN>"
        # - id: messenger-qa-page
        #   channel: messenger
        #   owner_mxid: "@admin:example.com"
        #   page_id: "<FACEBOOK_PAGE_ID>"
        #   access_token: "<PAGE_ACCESS_TOKEN>"
        # - id: instagram-qa-page-linked
        #   channel: instagram
        #   owner_mxid: "@admin:example.com"
        #   page_id: "<LINKED_FACEBOOK_PAGE_ID>"
        #   instagram_user_id: "<IG_PROFESSIONAL_ACCOUNT_ID>"
        #   access_token: "<PAGE_ACCESS_TOKEN>"
        # - id: instagram-login-qa
        #   channel: instagram_login
        #   owner_mxid: "@admin:example.com"
        #   instagram_user_id: "<IG_PROFESSIONAL_ACCOUNT_ID>"
        #   access_token: "<INSTAGRAM_USER_ACCESS_TOKEN>"

# Legacy WhatsApp settings. These are still used by WhatsApp templates, flows, media conversion,
# and by old provisioning endpoints while the bridge migrates to the generic meta.* config above.
whatsapp:
    # WhatsApp base URL
    base_url: https://graph.facebook.com
    version: v25.0
    # Deprecated. Use meta.webhook_path for the unified Meta webhook.
    webhook_path: /cloud
    # Endpoint for sending to approve template
    template_path: /message_templates
    file_name: File

    # Dict of error codes and and their reasons
    error_codes:
        1000:
            reason: File format unsupported
        1001:
            reason: "Last Mapped Bot Details And Sender Details Mismatch"
        1002:
            reason: "Number Does Not Exist On WhatsApp"
        1003:
            reason: "Unable To Send Message | Check your wallet balance"
        1004:
            reason: "Message sending failed because the user is inactive for session messaging and template messaging is disabled"
        1005:
            reason: "Message sending failed because the user is inactive for session messaging and the template did not match"
        1006:
            reason: "Message sending failed because the user is inactive for session messaging and has not opted in for template messages"
        1007:
            reason: "Message sending failed because the user is inactive for session messaging, has not opted in for template messages, and the template did not match"
        1008:
            reason: "User has not opted in and is inactive"
        1010:
            reason: "Invalid media URL"
        1011:
            reason: "Invalid media size"

# Python logging configuration.
#
# See section 16.7.2 of the Python documentation for more info:
# https://docs.python.org/3/library/logging.config.html#configuration-dictionary-schema
logging:
    version: 1
    formatters:
        colored:
            (): meta_cloud_bridge.util.ColorFormatter
            format: "[%(asctime)s] [%(levelname)s@%(name)s] %(message)s"
        normal:
            format: "[%(asctime)s] [%(levelname)s@%(name)s] %(message)s"
    handlers:
        console:
            class: logging.StreamHandler
            formatter: colored

    loggers:
        mau:
            level: DEBUG
        meta:
            level: DEBUG
        whatsapp:
            level: DEBUG
        aiohttp:
            level: INFO
    root:
        level: DEBUG
        handlers: [console]
