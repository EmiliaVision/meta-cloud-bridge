name: Python lint and CI/CD

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: isort
        run: uv run isort --check-only whatsapp meta_cloud_bridge
      - name: black
        run: uv run black --check whatsapp meta_cloud_bridge
      - name: pre-commit generic checks
        run: |
          uv run pre-commit run -av trailing-whitespace
          uv run pre-commit run -av end-of-file-fixer
          uv run pre-commit run -av check-yaml
          uv run pre-commit run -av check-added-large-files

  docker:
    if: "github.ref_name == 'master'"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: emiliavision/meta-cloud-bridge:testing

  deploy-testing:
    if: "github.ref_name == 'master'"
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect to server and update docker image
        run: |-
          echo "** Connecting to testing server **"

          sudo apt-get update -qq
          which ssh-agent || ( sudo apt-get install -y openssh-client )
          eval $(ssh-agent -s)
          ssh-add <(echo "${{ secrets.SSH_PRIVATE_KEY }}")
          mkdir -vp ~/.ssh
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
          ssh -tt ${{ secrets.TESTING }} "echo '** Connected **'"

          echo "** Download updated docker image **"
          ssh -tt ${{ secrets.TESTING }} "docker pull emiliavision/meta-cloud-bridge:${{ vars.TAG_TESTING }}"

          echo "** Update bridge image in registered domains **"
          for stack in ${{ vars.STACKS }}; do
            stack_name=$(echo ${stack} | tr -d '.')
            service=$(echo ${stack} | cut -d '.' -f1)
            bridge_service="${stack_name}_${service}-meta-cloud-bridge"

            ssh -tt ${{ secrets.TESTING }} " \
              if docker service ps ${bridge_service}; then \
                docker service rm ${bridge_service}; \
              else \
                echo 'The service ${bridge_service} does not exist'; \
              fi; \
            "

            ssh -tt ${{ secrets.TESTING }} "yes | docker-stack deploy ${stack_name};"
          done
        shell: bash
