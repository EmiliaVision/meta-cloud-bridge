repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude_types: [markdown]
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types_or: [python, pyi]
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types_or: [python, pyi]
